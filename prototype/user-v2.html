<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RentRadar · 一句话找房</title>
<style>
:root{
  --bg:#f6f3ec; --paper:#fffdf9; --paper2:#fbf8f1; --sand:#efe9de;
  --ink:#1c1b19; --muted:#6f6a62; --faint:#9a948a;
  --line:#e6e0d6; --line2:#d8d0c2;
  --green:#1f5d4a; --green2:#174638; --green-soft:#e6efe9;
  --coral:#c25934; --coral-soft:#f8e9e2;
  --amber:#a8741a; --amber-soft:#f8efdc;
  --r:18px;
  --shadow:0 2px 10px rgba(28,27,25,.04),0 18px 50px rgba(28,27,25,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:0 0}::-webkit-scrollbar-thumb{background:#d8d0c2;border-radius:5px}
.nav{height:64px;display:flex;align-items:center;gap:12px;padding:0 30px;position:sticky;top:0;z-index:40;background:rgba(246,243,236,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(230,224,214,.7)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.logo{width:30px;height:30px;border-radius:10px;background:var(--green);position:relative;overflow:hidden;flex:0 0 30px}
.logo::after{content:'';position:absolute;left:8px;top:8px;width:14px;height:14px;border:1.6px solid #dcebe1;border-radius:50%}
.logo::before{content:'';position:absolute;left:14px;top:15px;width:1.5px;height:8px;background:#dcebe1;transform:rotate(32deg);transform-origin:top}
.bname{font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.bname small{display:block;font-size:10px;color:var(--muted);font-weight:400;letter-spacing:.3px;margin-top:-2px}
.nav .sp{flex:1}
.nav-status{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);border:1px solid var(--line);background:rgba(255,253,249,.7);padding:5px 11px;border-radius:20px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.nav-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,253,249,.7);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.nav-btn:hover{color:var(--ink);border-color:var(--line2)}
.nav-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#f6f3ec;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}

/* ============ 入口 ============ */
.landing{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:44px 24px 70px;position:relative;overflow:hidden}
.landing::before{content:'';position:absolute;width:780px;height:780px;border-radius:50%;right:-220px;top:-260px;background:radial-gradient(circle,rgba(31,93,74,.10),rgba(31,93,74,0) 66%)}
.landing::after{content:'';position:absolute;width:620px;height:620px;border-radius:50%;left:-260px;bottom:-300px;background:radial-gradient(circle,rgba(194,89,52,.08),rgba(194,89,52,0) 66%)}
.ask{width:min(800px,100%);position:relative;z-index:1;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-weight:650;margin-bottom:18px}
.eyebrow::before{content:'';width:22px;height:1px;background:var(--green);opacity:.5}
h1{font-size:clamp(34px,5.2vw,54px);line-height:1.12;letter-spacing:-1.8px;font-weight:680;margin-bottom:14px}
h1 em{font-style:normal;color:var(--green)}
.lede{font-size:14.5px;color:var(--muted);line-height:1.8;max-width:520px;margin:0 auto}
.composer{margin-top:30px;background:var(--paper);border:1px solid var(--line2);border-radius:22px;padding:18px 18px 12px;box-shadow:var(--shadow);text-align:left;transition:.16s}
.composer:focus-within{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft),0 18px 50px rgba(28,27,25,.07)}
.composer textarea{width:100%;min-height:78px;border:none;outline:none;resize:none;background:transparent;font-size:16px;line-height:1.72;color:var(--ink)}
.composer textarea::placeholder{color:var(--faint)}
.composer-bar{display:flex;align-items:center;gap:10px;margin-top:6px}
.ghost{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;padding:7px 12px;border-radius:10px;transition:.13s}
.ghost:hover{border-color:var(--line2);color:var(--ink);background:var(--paper2)}
.ghost svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.hint{font-size:11px;color:var(--faint);margin-left:auto}
.send{display:inline-flex;align-items:center;gap:7px;border:none;background:var(--green);color:#f7fbf8;font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:12px;transition:.15s}
.send:hover{background:var(--green2)}
.send svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.examples{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;text-align:left}
.ex{display:flex;align-items:flex-start;gap:11px;padding:14px 15px;background:rgba(255,253,249,.62);border:1px solid var(--line);border-radius:14px;transition:.15s;text-align:left}
.ex:hover{background:var(--paper);border-color:#c9d8cf;transform:translateY(-1px);box-shadow:0 8px 24px rgba(28,27,25,.06)}
.ex .ic{width:30px;height:30px;border-radius:9px;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;flex:0 0 30px}
.ex .ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ex b{display:block;font-size:13px;font-weight:650;margin-bottom:2px}
.ex small{font-size:11.5px;color:var(--muted);line-height:1.55}
.micro{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:22px;font-size:11.5px;color:var(--faint)}
.micro span{display:inline-flex;align-items:center;gap:5px}
.micro i{width:4px;height:4px;border-radius:50%;background:var(--green);opacity:.55}
.entry-foot{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--faint);letter-spacing:.02em}

/* ============ 工作区 ============ */
.workspace{display:none;height:calc(100vh - 64px);min-height:560px}
.workspace.on{display:grid;grid-template-columns:390px minmax(0,1fr)}
.thread{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:rgba(255,253,249,.55)}
.thread-head{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line)}
.thread-head .tt{font-size:12.5px;font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread-head .sm{font-size:10.5px;color:var(--faint);margin-top:1px;font-weight:400}
.icon-btn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.icon-btn:hover{color:var(--ink);border-color:var(--line2);background:var(--paper)}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.messages{flex:1;overflow:auto;padding:20px 18px 6px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:10px;max-width:100%}
.msg.me{justify-content:flex-end}
.mav{width:26px;height:26px;border-radius:8px;flex:0 0 26px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:650;margin-top:2px}
.mav.ai{background:var(--green);color:#f7fbf8}
.mav.me{background:var(--sand);color:var(--muted)}
.bubble{font-size:13px;line-height:1.75;min-width:0}
.msg.me .bubble{background:var(--ink);color:#f6f3ec;border-radius:14px 14px 4px 14px;padding:9px 13px;max-width:88%}
.msg .bubble .panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:0 1px 4px rgba(28,27,25,.03)}
.msg .bubble .panel p{margin:0 0 7px}.msg .bubble .panel p:last-child{margin:0}
.plan{margin-top:10px;padding:10px 11px;background:var(--paper2);border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;gap:7px}
.step{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;color:var(--muted);line-height:1.5}
.step .sd{width:14px;height:14px;border-radius:50%;border:1.4px solid var(--line2);flex:0 0 14px;margin-top:1px;position:relative}
.step.done .sd{background:var(--green);border-color:var(--green)}
.step.done .sd::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:7px;border-right:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(42deg)}
.step.now .sd{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.step b{color:var(--ink);font-weight:600}
.quick-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 10px}
.qc{font-size:11px;border:1px solid var(--line2);background:var(--paper);color:var(--muted);padding:5px 10px;border-radius:16px;transition:.13s}
.qc:hover{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.thread-composer{padding:10px 14px 14px;border-top:1px solid var(--line)}
.tc{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line2);border-radius:13px;padding:6px 6px 6px 13px;transition:.15s}
.tc:focus-within{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.tc input{flex:1;border:none;outline:none;background:transparent;font-size:12.5px;color:var(--ink);min-width:0}
.tc input::placeholder{color:var(--faint)}
.tc button{width:30px;height:30px;border-radius:9px;border:none;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 30px}
.tc button:hover{background:var(--green2)}
.tc button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.canvas{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.canvas-head{padding:14px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(246,243,236,.8);backdrop-filter:blur(10px)}
.conds{display:flex;gap:6px;flex-wrap:wrap}
.cond{display:inline-flex;align-items:center;gap:6px;font-size:11px;background:var(--paper);border:1px solid var(--line);padding:5px 9px;border-radius:20px;color:var(--muted);transition:.13s;cursor:pointer}
.cond:hover{border-color:var(--line2);color:var(--ink)}
.cond b{color:var(--ink);font-weight:600}
.cond .x{color:var(--faint);font-size:12px;line-height:1}
.canvas-actions{margin-left:auto;display:flex;gap:7px}
.cbtn{font-size:11.5px;border:1px solid var(--line2);background:var(--paper);color:var(--ink);padding:6px 11px;border-radius:9px;transition:.13s}
.cbtn:hover{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.cbtn.primary{background:var(--ink);border-color:var(--ink);color:#f6f3ec}
.cbtn.primary:hover{background:#000}
.canvas-tabs{display:flex;align-items:center;gap:2px;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(246,243,236,.6)}
.ctab{padding:12px 13px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:.13s}
.ctab:hover{color:var(--ink)}
.ctab.on{color:var(--green);border-bottom-color:var(--green);font-weight:650}
.ctab .n{font-size:10px;background:var(--sand);color:var(--muted);padding:1px 5px;border-radius:8px;margin-left:4px}
.canvas-body{flex:1;overflow:auto;padding:18px 24px 90px}
.status-line{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.live{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft);animation:live 1.4s ease-in-out infinite}
@keyframes live{0%,100%{box-shadow:0 0 0 3px var(--green-soft)}50%{box-shadow:0 0 0 6px rgba(31,93,74,.06)}}
.status-line b{color:var(--ink);font-weight:600}
.status-line .sep{color:var(--line2)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.rcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.18s;box-shadow:0 1px 4px rgba(28,27,25,.03)}
.rcard:hover{transform:translateY(-3px);box-shadow:0 18px 42px rgba(28,27,25,.11);border-color:#cfd8d1}
.rcover{height:168px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2));display:flex;align-items:flex-end;padding:12px}
.rcover::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.18) 22px 23px)}
.rcover .mark{font-size:44px;line-height:1;font-weight:700;color:rgba(255,255,255,.9);position:relative;z-index:1}
.rcover .cap{position:absolute;top:11px;left:11px;font-size:9.5px;letter-spacing:.04em;background:rgba(28,27,25,.42);color:#fff;padding:3px 8px;border-radius:12px;z-index:2}
.rcover .score{position:absolute;top:10px;right:10px;z-index:2;background:rgba(255,253,249,.94);border:1px solid rgba(255,255,255,.5);border-radius:12px;padding:5px 9px;font-size:15px;font-weight:750;color:var(--green);line-height:1.1;text-align:center;min-width:44px}
.rcover .score small{display:block;font-size:8px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.rbody{padding:15px 16px 16px}
.rtop{display:flex;align-items:flex-start;gap:8px}
.rt{min-width:0}
.rname{font-size:15.5px;font-weight:680;letter-spacing:-.2px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:11px;color:var(--muted);margin-top:2px}
.rprice{font-size:22px;font-weight:720;letter-spacing:-.7px;margin-top:9px;line-height:1.2}
.rprice span{font-size:11px;color:var(--muted);font-weight:400;letter-spacing:0}
.rmeta{display:flex;gap:11px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:3px}
.rmeta b{color:var(--ink);font-weight:600}
.rtags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.rtag{font-size:10px;padding:2.5px 7px;border-radius:14px;background:var(--sand);color:#5b564d;white-space:nowrap}
.rtag.g{background:var(--green-soft);color:var(--green)}
.rtag.a{background:var(--amber-soft);color:var(--amber)}
.rwhy{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted);line-height:1.65}
.rwhy b{color:var(--ink);font-weight:600}
.ractions{display:flex;gap:7px;margin-top:11px}
.ractions button{flex:1;font-size:11.5px;padding:7px 8px;border-radius:9px;border:1px solid var(--line2);background:transparent;color:var(--ink)}
.ractions button:hover{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.ractions .look{background:var(--ink);border-color:var(--ink);color:#f6f3ec}
.ractions .look:hover{background:#000;color:#fff}
.compare-wrap{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
table.cmp{width:100%;border-collapse:collapse;font-size:12px}
.cmp th{text-align:left;font-size:10.5px;letter-spacing:.03em;color:var(--muted);font-weight:600;padding:11px 14px;background:var(--paper2);border-bottom:1px solid var(--line)}
.cmp td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp tr:last-child td{border-bottom:none}
.cmp .nm2{font-weight:650}
.cmp .sm2{font-size:10.5px;color:var(--muted)}
.cmp .best{color:var(--green);font-weight:650}
.mapbox{height:440px;border:1px solid var(--line);border-radius:18px;background:
  linear-gradient(rgba(31,93,74,.045) 1px,transparent 1px),
  linear-gradient(90deg,rgba(31,93,74,.045) 1px,transparent 1px),var(--paper2);
  background-size:28px 28px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--muted)}
.mapbox .pin{width:16px;height:16px;border-radius:50% 50% 50% 0;background:var(--green);transform:rotate(-45deg);position:absolute;box-shadow:0 3px 8px rgba(31,93,74,.3)}
.mapbox .pin.p1{left:32%;top:38%}.mapbox .pin.p2{left:55%;top:30%;background:var(--coral)}.mapbox .pin.p3{left:48%;top:62%;background:var(--amber)}
.mapbox b{font-size:14px;color:var(--ink)}
.mapbox small{font-size:11.5px;color:var(--muted)}
.map-line{position:absolute;left:20%;top:46%;width:45%;height:2px;background:var(--green);opacity:.35;transform:rotate(-12deg)}
.map-line::after{content:'';position:absolute;right:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--green);opacity:.6}
.sticky-compare{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(18px);background:var(--ink);color:#f6f3ec;border-radius:14px;padding:9px 11px 9px 16px;display:flex;align-items:center;gap:12px;font-size:12px;box-shadow:0 14px 40px rgba(28,27,25,.25);opacity:0;pointer-events:none;transition:.2s;z-index:80}
.sticky-compare.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.sticky-compare .n{font-weight:650}
.sticky-compare button{background:#f6f3ec;color:var(--ink);border:none;border-radius:9px;padding:6px 12px;font-size:11.5px;font-weight:600}
.mob-btn,.mob-back{display:none}
@media(max-width:840px){
  .mob-btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;border:1px solid var(--line2);background:var(--paper);color:var(--green);padding:5px 10px;border-radius:14px;font-weight:600}
  .mob-back{display:inline-flex}
}

/* ============ 弹层 ============ */
.overlay{position:fixed;inset:0;background:rgba(28,27,25,.38);opacity:0;pointer-events:none;transition:.2s;z-index:90}
.overlay.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(540px,100%);background:var(--paper);border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(28,27,25,.15);transform:translateX(102%);transition:.28s cubic-bezier(.2,.8,.2,1);z-index:100;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.drawer-head h3{font-size:15px;font-weight:680;flex:1;line-height:1.35}
.drawer-head .sm{font-size:11px;color:var(--muted);margin-top:2px;font-weight:400}
.drawer-body{flex:1;overflow:auto;padding:18px 20px 110px}
.drawer-foot{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px}
.drawer-foot button{flex:1;padding:10px;border-radius:10px;font-size:12.5px;border:1px solid var(--line2);background:transparent;color:var(--ink)}
.drawer-foot .primary{background:var(--green);border-color:var(--green);color:#fff}
.drawer-foot .primary:hover{background:var(--green2)}
.dsec{font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:18px 0 8px}
.dsec:first-child{margin-top:0}
.dbox{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--muted);line-height:1.75}
.dbox b{color:var(--ink);font-weight:600}
.bars{display:flex;flex-direction:column;gap:9px}
.brow .bh{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}
.bbar{height:5px;background:var(--sand);border-radius:3px;overflow:hidden}
.bbar i{display:block;height:100%;background:var(--green);border-radius:3px}
.gal2{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.gal2 .g{height:82px;border-radius:9px;background:linear-gradient(135deg,#dcebe1,#c3d8cc);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:6px;font-size:9.5px;color:#2f5c4b}
.gal2 .g::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 16px,rgba(255,255,255,.25) 16px 17px)}
.spark{width:100%;height:64px}

.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:min(560px,calc(100% - 28px));background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 80px rgba(28,27,25,.22);z-index:101;opacity:0;pointer-events:none;transition:.22s}
.sheet.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.sheet-head{padding:18px 20px 12px;display:flex;align-items:center;gap:10px}
.sheet-head h3{font-size:15px;font-weight:680;flex:1}
.sheet-body{padding:0 20px 8px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;color:var(--muted)}
.field input,.field select{background:var(--paper2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12.5px;color:var(--ink);outline:none}
.field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.field.full{grid-column:1/-1}
.musts{display:flex;gap:6px;flex-wrap:wrap}
.must{font-size:11px;border:1px solid var(--line2);background:var(--paper);padding:5px 9px;border-radius:16px;color:var(--muted)}
.must.on{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
.sheet-foot{padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end}
.sheet-foot button{padding:9px 16px;border-radius:10px;font-size:12.5px;border:1px solid var(--line2);background:transparent}
.sheet-foot .primary{background:var(--green);border-color:var(--green);color:#fff}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);background:var(--ink);color:#f6f3ec;font-size:12px;padding:10px 15px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:200;box-shadow:0 10px 30px rgba(28,27,25,.25)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:1050px){

  .cards{grid-template-columns:1fr}
}
@media(max-width:840px){

}

<!-- ================= 入口 ================= -->
<main class="landing" id="landing">
  <section class="ask">
    <div class="eyebrow">先说人话，再谈条件</div>
    <h1>今天想住在<em>哪里</em>？</h1>
    <p class="lede">告诉我公司在哪、预算多少、能接受多长通勤。我先查本机库存，再只对你眼前的几套算通勤、抓详情。</p>

    <div class="composer">
      <textarea id="prompt" placeholder="例如：公司在会展中心，预算 4000，想住 5 号线沿线，通勤 40 分钟内，最好有电梯" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();startChat()}"></textarea>
      <div class="composer-bar">
        <button class="ghost" onclick="openSheet()">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          补充条件
        </button>
        <span class="hint">Enter 发送 · Shift + Enter 换行</span>
        <button class="send" onclick="startChat()">
          开始找房
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>

    <div class="examples">
      <button class="ex" onclick="startChat('公司在会展中心，预算 4000，想住 5 号线沿线，通勤 40 分钟内，最好有电梯')">
        <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></span>
        <span><b>通勤优先</b><small>会展中心 · 4000 · 40 分钟内</small></span>
      </button>
      <button class="ex" onclick="startChat('两个人住，想要两居，预算 4500，5 号线沿线，通勤 45 分钟内')">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 21v-7h6v7"/></svg></span>
        <span><b>两个人住</b><small>两居 · 4500 · 5 号线</small></span>
      </button>
      <button class="ex" onclick="startChat('预算 3000，龙岗方向，接受 60 分钟通勤，两居优先')">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 18V9M10 18V5M16 18v-7M22 18h-20"/></svg></span>
        <span><b>预算优先</b><small>3000 · 龙岗 · 接受远一点</small></span>
      </button>
      <button class="ex" onclick="startChat('帮我对比 5 号线 4500 以内的几套，重点看实拍和装修')">
        <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 16l5-4 4 3 3-2 6 5"/></svg></span>
        <span><b>先看图片</b><small>实拍 · 装修 · 图文一致</small></span>
      </button>
    </div>

    <div class="micro">
      <span><i></i>先查本地 1130 套</span>
      <span><i></i>只为候选算通勤</span>
      <span><i></i>不自动下单</span>
    </div>
  </section>
  <div class="entry-foot">RentRadar · 本地优先的租房决策助手</div>
</main>

<!-- ================= 对话 + 结果 ================= -->
<main class="workspace" id="workspace">
  <aside class="thread">
    <div class="thread-head">
      <div class="tt">找房助手<div class="sm">本次会话 · 本地库存</div></div>

    <div class="dbox">真实版本：候选详情页抓 3–6 张图 → pHash 去重 → Qwen-VL 标签（实拍/装修/采光/可见问题/图文一致）→ 置信度 + 原图证据。当前未接入。</div>`;
  document.getElementById('overlay').classList.add('on');
  document.getElementById('drawer').classList.add('on');
}
function closeAll(){
  document.getElementById('overlay').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('sheetOverlay').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
}
function openSheet(){
  document.getElementById('sheetOverlay').classList.add('on');
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){
  document.getElementById('sheetOverlay').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
}
function applySheet(){
  const company=document.getElementById('sCompany').value||'深圳会展中心';
  const budget=document.getElementById('sBudget').value;
  const commute=document.getElementById('sCommute').value;
  const layout=document.getElementById('sLayout').value;
  const area=document.getElementById('sArea').value;
  const musts=[...document.querySelectorAll('.must.on')].map(x=>x.textContent).join('、');
  const text=`公司在${company}，预算 ${budget}，${area}，通勤 ${commute} 内，${layout}${musts?'，最好有'+musts:''}`;
  document.getElementById('prompt').value=text;
  closeSheet();
  toast('条件已填入，点“开始找房”');
}
function backHome(){
  document.getElementById('landing').style.display='flex';
  document.getElementById('workspace').classList.remove('on');
  window.scrollTo(0,0);
}
let toastTimer=null;
function toast(m){
  const el=document.getElementById('toast'); el.textContent=m; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('on'),2200);
}
document.addEventListener('DOMContentLoaded',()=>{
  const s=DATA.stats||{}; const el=document.getElementById('navCount'); if(el&&s.listings) el.textContent=s.listings;
  if(location.hash==='#chat'){ setTimeout(()=>startChat(),80); }
  if(location.hash==='#detail'){ setTimeout(()=>{ startChat(); setTimeout(()=>openDetail('海鹰大厦'),1100); },80); }
});
window.addEventListener('resize',()=>{});
</script>
</body>
</html>
